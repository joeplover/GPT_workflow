<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Photo Dream 创作中台</title><link rel="stylesheet" href="/photodream/static/console.css"><script src="/photodream/static/errors.js" defer></script><script src="/photodream/static/login.js" defer></script></head>
<body class="console-body"><main class="login-page"><section class="login-art"><div class="studio-logo">▥ <strong>Photo Dream</strong><span>创作中台</span></div><div><div class="eyebrow">A SPACE FOR YOUR STORIES</div><h1>从一个想法，<br>到每一个镜头。</h1><p>让项目、角色与场景有序生长。和团队一起，把故事变成画面。</p></div><small class="login-foot muted">项目管理 / 图像创作 / 团队协作</small></section><section class="login-form-wrap"><div class="login-box"><div class="login-tabs"><button type="button" id="loginTab" class="active">登录</button><button type="button" id="registerTab" hidden>注册账号</button></div><h2 id="authTitle">欢迎回来</h2><p id="authSubtitle">登录后继续你的创作。</p><form id="authForm" class="c-form"><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_\-.]+" placeholder="英文字母、数字或下划线"></label><label id="displayLabel" hidden>显示名称<input name="display_name" maxlength="100" placeholder="如何称呼你"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="authError" class="form-error" role="alert"></p><button id="authSubmit" class="primary" type="submit">登录</button></form></div></section></main></body></html>
