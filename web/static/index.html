<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单图工作台 · Photo Dream</title>
  <link rel="stylesheet" href="/photodream/static/styles.css">
  <link rel="stylesheet" href="/photodream/static/console.css">
  <script src="/photodream/static/shell.js" defer></script>
</head>
<body>

<header class="topbar">
  <span class="topbar__title">单图工作台</span>
  <a class="text-link" href="/photodream/storyboard">胶片分镜工作台 →</a>
  <div class="topbar__row">
    <input id="apiKey" type="password" placeholder="API Key" class="topbar__input">
    <input id="baseUrl" placeholder="接口地址" class="topbar__input topbar__input--url">
    <select id="projectSelect" class="topbar__select"></select>
    <input id="projectName" placeholder="新项目名称" class="topbar__input topbar__input--proj">
    <span id="configStatus" class="topbar__status">加载中...</span>
  </div>
</header>

<div class="main">
  <div class="left">

    <section class="panel">
      <h2 class="panel__title">角色卡</h2>
      <div class="card-form">
        <input id="characterName" placeholder="角色名称" class="field-input">
        <textarea id="characterContent" rows="2" placeholder="外貌、服装、年龄、表情气质等" class="field-input"></textarea>
        <div class="card-form__footer">
          <label class="file-label">
            <span class="file-label__text" id="characterImageText">选择参考图</span>
            <input id="characterImage" type="file" accept="image/*" hidden>
          </label>
          <button id="addCharacterCardBtn" type="button" class="btn btn--add">新增角色卡</button>
        </div>
      </div>
      <div id="characterCardList" class="card-list"></div>
    </section>

    <section class="panel">
      <h2 class="panel__title">场景卡</h2>
      <div class="card-form">
        <input id="sceneName" placeholder="场景名称" class="field-input">
        <textarea id="sceneContent" rows="2" placeholder="地点外观、光线、天气、氛围等" class="field-input"></textarea>
        <div class="card-form__footer">
          <label class="file-label">
            <span class="file-label__text" id="sceneImageText">选择参考图</span>
            <input id="sceneImage" type="file" accept="image/*" hidden>
          </label>
          <button id="addSceneCardBtn" type="button" class="btn btn--add">新增场景卡</button>
        </div>
      </div>
      <div id="sceneCardList" class="card-list"></div>
    </section>

    <section class="panel">
      <h2 class="panel__title">生成参数</h2>
      <label for="systemPrompt">系统提示词</label>
      <textarea id="systemPrompt" rows="3" placeholder="画风、色调、构图规则、角色一致性要求等（可选）" class="field-input"></textarea>
      <label for="prompt">用户提示词</label>
      <textarea id="prompt" rows="4" placeholder="当前镜头提示词：主体、动作、构图、机位、氛围..." class="field-input"></textarea>
      <label for="model">模型（可选择或直接输入）</label><input id="model" list="modelOptions" placeholder="输入模型名称" class="field-input" autocomplete="off"><datalist id="modelOptions"></datalist>
      <label for="sizePreset">常用比例与分辨率</label><select id="sizePreset" class="field-input"></select>
      <label for="size">自定义分辨率（宽 × 高）</label><input id="size" placeholder="例如 1920x1080" class="field-input" autocomplete="off">
      <p id="sizeInfo" class="status-text"></p><p class="status-text">可手动填写其他模型与尺寸，实际支持范围以所用接口为准。</p>
      <div class="ref-section">
        <label class="file-label file-label--full">
          <span class="file-label__text" id="referenceImagesText">上传参考图（可多选）</span>
          <input id="referenceImages" type="file" accept="image/*" multiple hidden>
        </label>
        <div id="referencePreview" class="ref-grid empty-state">还没有上传参考图（选中带图片的卡片或上传单独参考图）</div>
      </div>
      <button id="submitBtn" class="btn btn--submit">开始生图</button>
      <span id="submitStatus" class="status-text">等待输入</span>
    </section>

  </div>

  <div class="right">

    <section class="panel">
      <h2 class="panel__title">生成结果</h2>
      <div id="resultEmpty" class="empty-state">最新生成结果会显示在这里。</div>
      <div id="resultCard" class="result is-hidden">
        <img id="resultImage" class="result__image" alt="生成结果">
        <div class="result__body">
          <p id="resultMeta" class="result__meta"></p>
          <p id="resultPrompt" class="result__prompt"></p>
          <p id="resultComposedPrompt" class="result__prompt"></p>
          <a id="resultLink" class="text-link" href="#" target="_blank" rel="noopener">打开原图</a>
          <a id="resultDownload" class="text-link" href="#" download>下载图片</a>
          <a id="generationHistory" class="text-link" href="/photodream/#generations">项目生成日志</a>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel__title">镜头历史</h2>
      <div id="historyList" class="history-grid">
        <div class="empty-state">暂无镜头历史。</div>
      </div>
    </section>

  </div>
</div>

<script src="/photodream/static/image-settings.js" defer></script>
<script src="/photodream/static/app.js" defer></script>
</body>
</html>
